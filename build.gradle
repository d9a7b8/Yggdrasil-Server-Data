plugins {
    id 'java'
}

group = 'fr.traodev.yggdrasil.server.data'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

repositories {
    mavenCentral()
    maven {
        url = uri('https://maven.geo-solutions.it/')
    }
}

dependencies {
    implementation 'io.netty:netty-handler:4.1.117.Final'
    implementation 'me.steinborn:libdeflate-java-core:0.1.0-beta'
}

test {
    useJUnitPlatform()
}